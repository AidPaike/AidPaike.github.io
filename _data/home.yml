    intro: "我目前就读于国防科技大学网络空间安全专业，研究编译器模糊测试、软件测试、智能体安全与智能化软件工程。"
    detail: "我的工作关注如何从历史缺陷与程序行为中提取有效信号，合成并调度更具缺陷触发能力的测试用例，让复杂软件中的深层错误更早暴露。"
    question_label: "当前问题"
    question: "怎样让测试系统不只是生成更多输入，而是更快抵达真正脆弱的程序状态？"
    scroll_label: "向下浏览研究档案"
  research:
    number: "01"
    kicker: "研究议题"
    title: "研究方向"
    intro: "从测试用例生成到复杂智能体评估，我关注同一个核心问题：如何系统地发现那些难以观察、难以复现的失败。"
    items:
      - code: "CF"
        title: "编译器模糊测试"
        description: "利用历史缺陷、代码片段合成与反馈调度，提高编译器深层缺陷的触发效率。"
      - code: "ST"
        title: "软件测试"
        description: "研究自动化测试生成、异常行为反馈与缺陷定位，提升复杂软件的可靠性。"
      - code: "AS"
        title: "智能体安全"
        description: "面向大模型智能体的风险评估与安全测试，关注复杂任务中的失控与脆弱行为。"
      - code: "AI"
        title: "智能化软件工程"
        description: "探索人工智能在程序生成、测试与软件质量保障中的可信应用。"
