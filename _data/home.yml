  hero:
    eyebrow: "Software Security Researcher · Ph.D. Student"
    title: "Tracing hidden failures"
    title_accent: "at system boundaries."
    intro: "I am a Ph.D. student in Cyberspace Security at the National University of Defense Technology. My research spans compiler fuzzing, software testing, agent security, and AI for software engineering."
    detail: "I study how signals from historical bugs and program behavior can guide the synthesis and scheduling of test cases, helping deep failures surface earlier in complex software systems."
    question_label: "Current question"
    question: "How can testing systems move beyond generating more inputs and reach genuinely fragile program states faster?"
    scroll_label: "Explore the research dossier"
  research:
    number: "01"
    kicker: "Research agenda"
    title: "Research"
    intro: "From test generation to the evaluation of intelligent agents, my work asks one recurring question: how can we systematically expose failures that are difficult to observe and reproduce?"
    items:
      - code: "CF"
        title: "Compiler Fuzzing"
        description: "Using historical bugs, code-segment synthesis, and feedback-driven scheduling to trigger deep compiler defects more efficiently."
      - code: "ST"
        title: "Software Testing"
        description: "Automating test generation, anomalous-behavior feedback, and fault discovery for dependable software systems."
      - code: "AS"
        title: "Agent Security"
        description: "Evaluating risks in LLM-based agents, with an emphasis on unsafe and brittle behavior during complex tasks."
      - code: "AI"
        title: "AI for Software Engineering"
        description: "Exploring trustworthy uses of AI in program generation, testing, and software quality assurance."
  news:
    number: "02"
    kicker: "Recent updates"
    title: "News"
    items:
      - date: "2026.01"
        text: "SSFuzz appeared in Empirical Software Engineering (EMSE)."
        url: "https://doi.org/10.1007/s10664-025-10777-0"
      - date: "2024.08"
        text: "History-driven Compiler Fuzzing was accepted to ISSRE 2024."
        url: "https://doi.org/10.1109/ISSRE62328.2024.00040"
      - date: "2023.07"
        text: "Our work on ComFuzz was accepted to ESEC/FSE 2023."
        url: "https://doi.org/10.1145/3611643.3616332"
  publications:
    number: "03"
    kicker: "Selected work"
    title: "Publications"
